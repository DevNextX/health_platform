name: Workshop Build & Deploy per-branch

on:
  push:
    branches:
      - 'feature/**'
      - 'workshop/**'
      - 'dev/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch name to deploy (for manual run)'
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: workshop-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_frontend: ${{ steps.set_vars.outputs.IMAGE_FRONTEND }}
      image_backend: ${{ steps.set_vars.outputs.IMAGE_BACKEND }}
      branch_name: ${{ steps.set_vars.outputs.BRANCH_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute branch and image tags
        id: set_vars
        run: |
          if [ -n "${{ github.event.inputs.branch }}" ]; then
            BRANCH_NAME="${{ github.event.inputs.branch }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi
          # sanitize
          SANITIZED=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9.-]/-/g' | sed 's/^-*//; s/-*$//')
          IMAGE_FRONTEND="ghcr.io/${{ github.repository_owner }}/health-platform-frontend:${SANITIZED}"
          IMAGE_BACKEND="ghcr.io/${{ github.repository_owner }}/health-platform-backend:${SANITIZED}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "IMAGE_FRONTEND=$IMAGE_FRONTEND" >> $GITHUB_OUTPUT
          echo "IMAGE_BACKEND=$IMAGE_BACKEND" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ steps.set_vars.outputs.IMAGE_BACKEND }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend.nonroot
          push: true
          tags: ${{ steps.set_vars.outputs.IMAGE_FRONTEND }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine namespace
        id: namespace
        run: |
          BRANCH=${{ needs.build-and-push.outputs.branch_name }}
          if [ -z "$BRANCH" ] || [ "$BRANCH" == "null" ]; then
            BRANCH=${{ github.ref_name }}
          fi
          NS=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9.-]/-/g' | sed 's/^-*//; s/-*$//')
          NS=ws-${NS}
          echo "NAMESPACE=$NS" >> $GITHUB_OUTPUT

      - name: Create namespace and imagePullSecret
        env:
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          NAMESPACE=${{ steps.namespace.outputs.NAMESPACE }}
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl delete secret ghcr-secret --namespace="$NAMESPACE" --ignore-not-found=true || true
          kubectl create secret docker-registry ghcr-secret \
            --namespace="$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --docker-email="${GHCR_USERNAME}@users.noreply.github.com"

      - name: Deploy backend and frontend with resource requests/limits
        env:
          IMAGE_BACKEND: ${{ needs.build-and-push.outputs.image_backend }}
          IMAGE_FRONTEND: ${{ needs.build-and-push.outputs.image_frontend }}
        run: |
          set -e
          NAMESPACE=${{ steps.namespace.outputs.NAMESPACE }}
          cat > /tmp/deploy-${NAMESPACE}.yaml <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: backend
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: backend
            template:
              metadata:
                labels:
                  app: backend
              spec:
                containers:
                - name: backend
                  image: ${IMAGE_BACKEND}
                  ports:
                  - containerPort: 5000
                  resources:
                    requests:
                      cpu: "250m"
                      memory: "200Mi"
                    limits:
                      cpu: "250m"
                      memory: "200Mi"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: backend
          spec:
            selector:
              app: backend
            ports:
            - protocol: TCP
              port: 5000
              targetPort: 5000
            type: ClusterIP
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: frontend
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: frontend
            template:
              metadata:
                labels:
                  app: frontend
              spec:
                containers:
                - name: frontend
                  image: ${IMAGE_FRONTEND}
                  ports:
                  - containerPort: 8080
                  resources:
                    requests:
                      cpu: "250m"
                      memory: "200Mi"
                    limits:
                      cpu: "250m"
                      memory: "200Mi"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: frontend
          spec:
            selector:
              app: frontend
            ports:
            - protocol: TCP
              port: 80
              targetPort: 8080
            type: ClusterIP
          EOF

          kubectl apply -n ${NAMESPACE} -f /tmp/deploy-${NAMESPACE}.yaml

